# Pinned toolchain: solc 0.8.24, Foundry v1.8.1 (see .github/workflows/ci.yml),
# OpenZeppelin Contracts v5.1.0, forge-std v1.9.7 — both vendored under lib/
# (no submodules, no network). Bump only together with README + LISTING.md.
[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
verbosity = 3

# Deterministic fuzzing baseline; the CI profile cranks it up.
fuzz = { runs = 512 }

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 64, depth = 32 }

# Fast local invariant smoke profile.
[profile.invariant-smoke]
test = "test"
invariant = { runs = 32, depth = 32 }
